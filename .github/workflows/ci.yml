name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,train,demo]"

    - name: Run PyTest Suite
      run: |
        pytest -v --tb=short

  c-kernel-check:
    name: Compile & Verify Bare-Metal MCU C Kernel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & generate model_weights.h
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m nanostream.export_cli --out nanostream/mcu/model_weights.h

    - name: Compile C Kernel with GCC
      run: |
        gcc -O3 -Wall -Wextra -std=c99 -Inanostream/mcu -c nanostream/mcu/nanostream_mcu.c -o nanostream_mcu.o
        size nanostream_mcu.o
